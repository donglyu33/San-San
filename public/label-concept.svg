<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760">
  <title>San San cream label concept — illustrated glass jars</title>
  <desc>Two stylized glass jars with black lids, cream labels, black typography and red three-line seals. Packaging concept, not product photography.</desc>
  <defs>
    <linearGradient id="glass"><stop stop-color="#d8d1c3"/><stop offset=".15" stop-color="#faf7ef"/><stop offset=".5" stop-color="#e9e2d4"/><stop offset=".85" stop-color="#faf7ef"/><stop offset="1" stop-color="#c8c0b2"/></linearGradient>
    <linearGradient id="lid" x2="0" y2="1"><stop stop-color="#393633"/><stop offset="1" stop-color="#171615"/></linearGradient>
    <g id="jar">
      <ellipse cx="0" cy="520" rx="160" ry="17" fill="#171615" opacity=".08"/>
      <path d="M-129 91 Q-153 117-153 164V480Q-153 513-120 516H120Q153 513 153 480V164Q153 117 129 91Z" fill="url(#glass)" stroke="#bcb3a3" stroke-width="2"/>
      <rect x="-141" y="53" width="282" height="58" rx="13" fill="url(#lid)"/>
      <path d="M-129 68H129" stroke="#68615b"/>
      <rect x="-149" y="183" width="298" height="262" fill="#fffaf0" stroke="#ded6c7"/>
      <text y="235" text-anchor="middle" fill="#171615" font-family="Georgia,serif" font-size="27" letter-spacing="7">SAN SAN</text>
      <rect x="-22" y="258" width="44" height="49" fill="#8b1c1c"/>
      <path d="M-12 271H12M-12 282H12M-12 293H12" stroke="#fffaf0" stroke-width="3"/>
      <text y="413" text-anchor="middle" fill="#171615" font-family="Georgia,serif" font-size="12">One Spoon, Endless Ways.</text>
      <path d="M-127 137V164M-127 462V486" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".7"/>
    </g>
  </defs>
  <rect width="1000" height="760" fill="#eee7dc"/>
  <path d="M70 640H930" stroke="#cfc4b3"/>
  <g transform="translate(300 80)"><use href="#jar"/><text y="360" text-anchor="middle" font-family="Georgia,serif" font-size="29" fill="#171615">Chili Oil</text></g>
  <g transform="translate(700 80)"><use href="#jar"/><text y="360" text-anchor="middle" font-family="Georgia,serif" font-size="29" fill="#171615">Beef Chili</text></g>
  <text x="500" y="693" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" letter-spacing="3" fill="#685e51">PACKAGING CONCEPT · ILLUSTRATION</text>
